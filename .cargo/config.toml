# GNU (MinGW-w64) builds: link libgcc and winpthread statically so QuickEnhancer.exe never needs
# libgcc_s_seh-1.dll / libwinpthread-1.dll / libstdc++-6.dll next to it (checked by
# scripts/release.ps1). MSVC builds ignore this section.
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-arg=-static", "-C", "link-arg=-static-libgcc"]
